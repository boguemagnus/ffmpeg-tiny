# extra + still-image stack for kineticon image API (stb_image supplement).
# JPEG/PNG/BMP/TGA/GIF/PSD/HDR/PNM/WebP via image2 + format pipes.
# mpeg4 = MPEG-4 Part 2 / ASP (common in older .mp4/.avi); not HEVC.
PRESET_SUMMARY="extra + mpeg4 + mjpeg,bmp,targa,psd,hdr,pnm · image2 + image_*_pipe"
PRESET_ARGS=(
  --enable-zlib
  --enable-decoder=h264,mpeg4,vp8,vp9,av1,gif,webp,apng,png,mjpeg,bmp,targa,psd,hdr,pam,pbm,pgm,ppm
  --enable-parser=h264,mpeg4,vp8,vp9,av1,gif,webp,png,mjpeg
  --enable-demuxer=mov,matroska,avi,flv,gif,apng,image2,image2pipe,image_jpeg_pipe,image_png_pipe,image_bmp_pipe,image_webp_pipe,image_gif_pipe,image_psd_pipe,image_hdr_pipe,image_pam_pipe,image_pbm_pipe,image_pgm_pipe,image_ppm_pipe
  --enable-bsf=h264_mp4toannexb
)
