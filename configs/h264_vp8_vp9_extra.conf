# Creator video set + anim loops + AV1 + a few extra containers.
# zlib required for PNG/APNG and lossless WebP under --disable-autodetect.
PRESET_SUMMARY="h264,vp8,vp9,av1,gif,webp,apng · mov,matroska,avi,flv,gif,apng,image2"
PRESET_ARGS=(
  --enable-zlib
  --enable-decoder=h264,vp8,vp9,av1,gif,webp,apng,png
  --enable-parser=h264,vp8,vp9,av1,gif,webp,png
  --enable-demuxer=mov,matroska,avi,flv,gif,apng,image2
  --enable-bsf=h264_mp4toannexb
)
