name: Build Precompiled FFmpeg Static Libraries

on:
  workflow_dispatch:
    inputs:
      preset:
        description: Configure preset (configs/<name>.conf)
        required: false
        default: h264_vp8_vp9_extra_images_hw
        type: string

env:
  FFMPEG_PRESET: ${{ inputs.preset || 'h264_vp8_vp9_extra_images_hw' }}

jobs:
  build:
    name: Build FFmpeg (${{ matrix.artifact }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact: linux
            target: linux
            os: ubuntu-latest
          - artifact: windows-vulkan
            target: windows
            os: ubuntu-latest
            hw_api: vulkan
          - artifact: windows-d3d11
            target: windows
            os: ubuntu-latest
            hw_api: d3d11
          - artifact: macos
            target: macos
            os: macos-14
          - artifact: ios
            target: ios
            os: macos-14
          - artifact: ios-simulator
            target: ios-simulator
            os: macos-14
          - artifact: android
            target: android
            os: ubuntu-latest

    steps:
      - name: Checkout ffmpeg-tiny
        uses: actions/checkout@v4

      - name: Clone official FFmpeg (n7.1)
        run: git clone --depth 1 --branch n7.1 https://github.com/FFmpeg/FFmpeg.git src

      - name: Install Linux-hosted build dependencies
        if: matrix.target == 'linux' || matrix.target == 'windows' || matrix.target == 'android'
        run: |
          set -euo pipefail
          sudo apt-get update
          packages=(nasm pkg-config)
          if [[ "${{ matrix.target }}" == "windows" ]]; then
            packages+=(mingw-w64 libz-mingw-w64-dev)
          fi
          sudo apt-get install -y "${packages[@]}"

      # FFmpeg n7.1 needs vulkan >= 1.3.277; Ubuntu 24.04 libvulkan-dev is ~1.3.275.
      # Headers only — no GPU required on the runner.
      - name: Vendor Vulkan headers (>= 1.3.277)
        if: matrix.target == 'linux' || matrix.hw_api == 'vulkan'
        run: |
          chmod +x scripts/ensure_vulkan_headers.sh
          scripts/ensure_vulkan_headers.sh
          echo "PKG_CONFIG_PATH=${{ github.workspace }}/tools/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> "$GITHUB_ENV"
        shell: bash

      - name: Verify Vulkan pkg-config
        if: matrix.target == 'linux' || matrix.hw_api == 'vulkan'
        run: |
          pkg-config --modversion vulkan
          pkg-config --cflags vulkan
        shell: bash

      - name: Setup Android NDK
        if: matrix.target == 'android'
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      - name: Setup Java (Android JNI / MediaCodec)
        if: matrix.target == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Compile FFmpeg Preset
        run: |
          export TARGET_PLATFORM="${{ matrix.target }}"
          if [[ -n "${{ matrix.hw_api }}" ]]; then
            export HW_API="${{ matrix.hw_api }}"
          fi
          make build PRESET="${{ env.FFMPEG_PRESET }}"
        shell: bash

      - name: Collect build artifacts
        run: |
          preset="${{ env.FFMPEG_PRESET }}"
          mkdir -p staging
          cp -R "out/${preset}/lib" staging/
          cp -R "out/${preset}/include" staging/
        shell: bash

      - name: Upload static libraries
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-tiny-${{ matrix.artifact }}
          path: staging/
